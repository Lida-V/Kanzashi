<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 304" width="960" height="304" font-family="'Segoe UI','Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif" role="img" aria-label="工程の位置と 3 つの使い方">
<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4b8c"/></marker></defs>
<rect x="1" y="1" width="958" height="302" rx="14" fill="#f7f5fb" stroke="#d9d3e3" stroke-width="1.2" />
<text x="30" y="40" font-size="15" font-weight="bold" text-anchor="start" fill="#2b2733">制作の流れの中の位置</text><rect x="30" y="56" width="280" height="74" rx="10" fill="#ffffff" stroke="#d9d3e3" stroke-width="1.2" /><text x="170" y="87" font-size="15" font-weight="bold" text-anchor="middle" fill="#2b2733">頭と髪のパーツ分け</text><text x="170" y="110" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#6a6475">髪を頭と別のメッシュにする</text><line x1="314" y1="93" x2="335" y2="93" stroke="#7a4b8c" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="340" y="56" width="280" height="74" rx="10" fill="#7a4b8c" stroke="#7a4b8c" stroke-width="1.2" /><text x="480" y="87" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">Kanzashi</text><text x="480" y="110" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#f1e6f6">検出 → 塗り直し → 曲げ → 毛束ごとの UV</text><line x1="624" y1="93" x2="645" y2="93" stroke="#7a4b8c" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="650" y="56" width="280" height="74" rx="10" fill="#ffffff" stroke="#d9d3e3" stroke-width="1.2" /><text x="790" y="87" font-size="15" font-weight="bold" text-anchor="middle" fill="#2b2733">髪のテクスチャの貼り直し</text><text x="790" y="110" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#6a6475">毛束ごとの UV で作る</text><text x="30" y="178" font-size="15" font-weight="bold" text-anchor="start" fill="#2b2733">3 つの使い方</text><rect x="30" y="194" width="280" height="92" rx="10" fill="#ffffff" stroke="#d9d3e3" stroke-width="1.2" /><circle cx="56" cy="222" r="13" fill="#b7a2ee"/><text x="56" y="227" font-size="13" font-weight="bold" text-anchor="middle" fill="#2b2733">A</text><text x="78" y="227" font-size="14.5" font-weight="bold" text-anchor="start" fill="#2b2733">パネル（アドオン）</text><text x="48" y="252" font-size="11.5" font-weight="normal" text-anchor="start" fill="#6a6475">Blender のサイドバーで、</text><text x="48" y="269" font-size="11.5" font-weight="normal" text-anchor="start" fill="#6a6475">人が見ながら操作する</text><rect x="340" y="194" width="280" height="92" rx="10" fill="#ffffff" stroke="#d9d3e3" stroke-width="1.2" /><circle cx="366" cy="222" r="13" fill="#7fc8d6"/><text x="366" y="227" font-size="13" font-weight="bold" text-anchor="middle" fill="#2b2733">B</text><text x="388" y="227" font-size="14.5" font-weight="bold" text-anchor="start" fill="#2b2733">スクリプト</text><text x="358" y="252" font-size="11.5" font-weight="normal" text-anchor="start" fill="#6a6475">パネルなしの背景実行。</text><text x="358" y="269" font-size="11.5" font-weight="normal" text-anchor="start" fill="#6a6475">検出・UV・確認用の画像</text><rect x="650" y="194" width="280" height="92" rx="10" fill="#ffffff" stroke="#d9d3e3" stroke-width="1.2" /><circle cx="676" cy="222" r="13" fill="#9ad3a0"/><text x="676" y="227" font-size="13" font-weight="bold" text-anchor="middle" fill="#2b2733">C</text><text x="698" y="227" font-size="14.5" font-weight="bold" text-anchor="start" fill="#2b2733">スキル（AI エージェント）</text><text x="668" y="252" font-size="11.5" font-weight="normal" text-anchor="start" fill="#6a6475">エージェントが手順を進め、</text><text x="668" y="269" font-size="11.5" font-weight="normal" text-anchor="start" fill="#6a6475">要所でユーザーに確認する</text>
</svg>
